<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOS Gaza SSO - Calendar</title>
  <style>
    :root {
      --bg: #080b10;
      --card: #0d121a;
      --cell: #111722;
      --border: #15222e;
      --green: #39ff14;
      --green-glow: rgba(57, 255, 20, 0.25);
      --amber: #e8c84a;
      --red: #ff3c3c;
      --text: #e6edf3;
      --muted: #7d8590;
      --font: 'JetBrains Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 8px 6px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      width: 100vw;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    /* Top HUD */
    .top-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-box h1 {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--green);
    }

    .title-box p {
      font-size: 0.58rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .btn-lang {
      background: var(--bg);
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
    }

    /* Cycle Bar */
    .cycle-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
    }

    .cycle-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--green);
      font-family: var(--font);
      font-size: 0.65rem;
      padding: 3px 6px;
      border-radius: 4px;
    }

    /* Calendar Grid Fixed To 100% Mobile Screen */
    .calendar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 6px;
      margin-bottom: 10px;
      width: 100%;
    }

    .calendar-head-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .cal-month-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--green);
    }

    .cal-hint {
      font-size: 0.58rem;
      color: var(--muted);
    }

    .calendar-table {
      width: 100%;
      table-layout: fixed; /* Strictly lock columns to 1/7 of screen width */
      border-collapse: collapse;
    }

    .calendar-table th {
      padding: 4px 1px;
      font-size: 0.6rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-weight: 700;
    }

    .calendar-table td {
      height: 48px;
      vertical-align: middle;
      padding: 2px 1px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      text-align: center;
      position: relative;
    }

    .calendar-table td.empty {
      background: transparent;
      border-color: rgba(21, 34, 46, 0.2);
      cursor: default;
    }

    .calendar-table td.weekend {
      background: rgba(13, 18, 26, 0.4);
      opacity: 0.35;
      cursor: default;
    }

    .calendar-table td.active-day {
      border: 1.5px solid var(--green) !important;
      background: rgba(57, 255, 20, 0.12) !important;
      box-shadow: inset 0 0 8px var(--green-glow);
    }

    .cell-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .day-num {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }

    .day-badge {
      font-size: 0.5rem;
      padding: 1px 3px;
      border-radius: 2px;
      background: rgba(57, 255, 20, 0.18);
      color: var(--green);
      font-weight: 800;
      line-height: 1;
    }

    .dot-indicator {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--green);
      margin-top: 1px;
    }

    /* Selected Day Tasks Card */
    .task-details-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .task-details-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .task-day-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--green);
    }

    .btn-edit {
      background: var(--bg);
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--font);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
    }

    .task-details-body {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-label {
      font-size: 0.58rem;
      color: var(--amber);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .detail-text {
      color: var(--text);
      line-height: 1.35;
    }

    /* Edit Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 11, 16, 0.92);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 12px;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--card);
      border: 1px solid var(--green);
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
      width: 100%;
      max-width: 450px;
      border-radius: 6px;
      padding: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: var(--green);
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 8px;
    }

    .form-label {
      display: block;
      font-size: 0.6rem;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.72rem;
      padding: 6px;
      border-radius: 3px;
    }

    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--green);
    }

    .btn-submit {
      width: 100%;
      background: var(--green);
      color: var(--bg);
      border: none;
      font-family: var(--font);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 8px;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 4px;
    }

    /* RTL */
    [dir="rtl"] { text-align: right; }
    [dir="rtl"] .task-details-card {
      border-left: 1px solid var(--border);
      border-right: 3px solid var(--green);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-header">
      <div class="title-box">
        <h1><span class="pulse-dot"></span> <span id="lbl-title">SOS GAZA SSO CALENDAR</span></h1>
        <p id="lbl-sub">30-Day Mission Calendar • Mawasi Khan Yunis</p>
      </div>
      <button class="btn-lang" onclick="toggleLang()">
        <span>🌐</span> <b id="lbl-lang-btn">عربي</b>
      </button>
    </div>

    <div class="cycle-bar">
      <div>
        <span style="color:var(--muted);" id="lbl-start">Start: </span>
        <select class="cycle-select" id="start-date-select" onchange="changeStartDate(this.value)">
          <option value="15">15 Nov 2026 (Sun)</option>
          <option value="16">16 Nov 2026 (Mon)</option>
        </select>
      </div>
      <div>
        <span style="color:var(--muted);" id="lbl-workdays">Cycle: </span>
        <b style="color:var(--green);" id="lbl-workdays-val">20 Days (Sun-Thu)</b>
      </div>
    </div>

    <div class="calendar-card">
      <div class="calendar-head-title">
        <span class="cal-month-name" id="lbl-month-name">NOVEMBER 2026</span>
        <span class="cal-hint" id="lbl-hint">Tap day to view/edit</span>
      </div>

      <table class="calendar-table">
        <thead>
          <tr id="cal-th-row">
            <th>SUN</th>
            <th>MON</th>
            <th>TUE</th>
            <th>WED</th>
            <th>THU</th>
            <th>FRI</th>
            <th>SAT</th>
          </tr>
        </thead>
        <tbody id="calendar-body"></tbody>
      </table>
    </div>

    <div class="task-details-card">
      <div class="task-details-header">
        <span class="task-day-title" id="det-day-header">DAY 1 DETAILS</span>
        <button class="btn-edit" onclick="openEditModal()" id="btn-edit">✎ EDIT TASK</button>
      </div>
      <div class="task-details-body">
        <div>
          <div class="detail-label" id="lbl-det-task">Core Task:</div>
          <div class="detail-text" id="det-task">-</div>
        </div>
        <div>
          <div class="detail-label" id="lbl-det-req">From Whom to Request:</div>
          <div class="detail-text" id="det-req">-</div>
        </div>
        <div>
          <div class="detail-label" id="lbl-det-act">Action to Execute:</div>
          <div class="detail-text" id="det-act">-</div>
        </div>
        <div>
          <div class="detail-label" id="lbl-det-talk">Whom to Contact / Debrief:</div>
          <div class="detail-text" id="det-talk">-</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-heading">EDIT TASK</span>
        <button onclick="closeEditModal()" style="background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer;">✕</button>
      </div>
      <form id="edit-form" onsubmit="saveTaskEdit(event)">
        <div class="form-group">
          <label class="form-label" id="lbl-form-title">Task Title</label>
          <input type="text" id="form-task" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-form-req">From Whom to Request</label>
          <input type="text" id="form-req" class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-form-act">Action to Execute</label>
          <textarea id="form-act" class="form-textarea" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" id="lbl-form-talk">Whom to Contact / Debrief</label>
          <input type="text" id="form-talk" class="form-input" />
        </div>
        <button type="submit" class="btn-submit" id="btn-submit">SAVE MISSION CHANGES</button>
      </form>
    </div>
  </div>

  <script>
    let isAr = false;
    let startDayNum = 15;
    let selectedDayIndex = 1;

    const MASTER_TASKS = [
      {
        dayIndex: 1,
