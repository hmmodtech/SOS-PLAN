name: sos
description: A.Jami Safety and Security Officer SOS - tasks and memos planner.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  intl: any
  shared_preferences: any
  path: any
  path_provider: any
  http: any

  sqflite_sqlcipher: any
  flutter_secure_storage: any
  local_auth: any
  speech_to_text: any
  share_plus: any
  file_picker: any
  table_calendar: any

  flutter_local_notifications: any
  timezone: any
