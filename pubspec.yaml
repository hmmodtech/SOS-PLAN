  google_sign_in: any
  googleapis: any
  extension_google_sign_in_as_googleapis_auth: any
  flutter_appauth: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
