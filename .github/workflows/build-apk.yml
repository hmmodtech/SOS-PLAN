name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Any 3.35.x+ is fine. Pin the channel (not an exact patch) so the
          # wrapper/Gradle versions never drift out of Flutter's supported range.
          flutter-version: '3.35.x'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze (warnings do not stop the build)
        run: flutter analyze
        continue-on-error: true

      - name: Unit tests (failures do not stop the build)
        run: flutter test
        continue-on-error: true

      # The android/ folder is committed and complete, so nothing is generated
      # or overwritten here. `flutter build` still writes local.properties,
      # the Gradle wrapper and GeneratedPluginRegistrant automatically.
      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      # Surfaces the real Gradle/Dart error in the run's annotations, so the
      # cause is visible even when the raw job log cannot be downloaded.
      - name: Report build errors
        if: failure()
        run: |
          echo "----- last 80 log lines -----"
          tail -n 80 /tmp/build.log || true
          echo "----- key errors -----"
          grep -nEi "error:|FAILURE:|What went wrong|Caused by:|Execution failed|Could not resolve|e: file|Unsupported class|requires a placeholder" /tmp/build.log \
            | tail -n 25 | while IFS= read -r line; do
                echo "::error::${line}"
              done

      - name: Show APK details
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "SHA256:" && sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A.Jami-SOS-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
